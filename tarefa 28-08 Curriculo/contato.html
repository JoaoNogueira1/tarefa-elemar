<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Contato - João Vitor</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <header class="header">
    <div class="header-content">
      <h1>Formulário de Contato</h1>
      <p><a href="curriculoo.html" class="btn">← Voltar ao currículo</a></p>
    </div>
  </header>

  <main class="main flex-center">
    <form action="#" method="post" class="form">
      <div class="form-group">
        <label for="nome">Nome completo:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
      </div>

      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Digite seu email" required>
      </div>

      <div class="form-group">
        <label for="assunto">Assunto:</label>
        <input type="text" id="assunto" name="assunto" placeholder="Assunto da mensagem" required>
      </div>

      <div class="form-group">
        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem" required></textarea>
      </div>

      <button type="submit" class="btn">Enviar</button>
    </form>
  </main>

  <footer class="footer">
    João Vitor Nogueira da Silva. 2025
  </footer>
</body>
</html>
